<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamsaGo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🥟 SamsaGo</h1>

    <select id="language">
        <option value="ru">Русский</option>
        <option value="uz">O'zbekcha</option>
    </select>

    <button id="cartBtn">🛒 Корзина (0)</button>
</header>

<section class="products">

    <div class="card">
        <img src="images/beef.jpg" alt="Говяжья самса">
        <h2>🥩 Говяжья самса</h2>
        <p>25 000 сум</p>
        <button>Добавить в корзину</button>
    </div>

    <div class="card">
        <img src="images/chicken.jpg" alt="Куриная самса">
        <h2>🍗 Куриная самса</h2>
        <p>22 000 сум</p>
        <button>Добавить в корзину</button>
    </div>

    <div class="card">
        <img src="images/potato.jpg" alt="Картофельная самса">
        <p>18 000 сум</p>
        <button>Добавить в корзину</button>
    </div>

</section>

<footer>
    <p>© 2026 SamsaGo</p>
</footer>

<script src="script.js"></script>

</body>
</html>
