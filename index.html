<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SamsaGo</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="header">

<div class="logo">
🥟 <span>SamsaGo</span>
</div>

<div class="top-buttons">

<select id="language">
<option value="ru">Русский</option>
<option value="uz">O'zbekcha</option>
</select>

<button id="cartBtn">
🛒
<span id="cartCount">0</span>
</button>

</div>

</header>

<section class="hero">

<h1>🔥 Горячая самса прямо из тандыра</h1>

<p>
Доставка свежей самсы по вашему городу
</p>

<div class="heroButtons">

<button class="delivery">
🚚 Доставка
</button>

<button class="pickup">
🏪 Самовывоз
</button>

</div>

</section>

<section class="products">

<div class="card">

<img src="images/beef.jpg">

<h2>🥩 Говяжья самса</h2>

<p class="price">
25 000 сум
</p>

<div class="controls">

<button class="minus">−</button>

<span class="qty">0</span>

<button class="plus">+</button>

</div>

</div>

<div class="card">

<img src="images/chicken.jpg">

<h2>🍗 Куриная самса</h2>

<p class="price">
22 000 сум
</p>

<div class="controls">

<button class="minus">−</button>

<span class="qty">0</span>

<button class="plus">+</button>

</div>

</div>

<div class="card">

<img src="images/potato.jpg">

<h2>🥔 Картофельная самса</h2>

<p class="price">
18 000 сум
</p>

<div class="controls">

<button class="minus">−</button>

<span class="qty">0</span>

<button class="plus">+</button>

</div>

</div>

</section>

<section class="order">

<h2>📦 Оформление заказа</h2>

<input
type="text"
id="name"
placeholder="Имя">

<input
type="tel"
id="phone"
placeholder="Телефон">

<input
type="text"
id="address"
placeholder="Адрес доставки">

<textarea
id="comment"
placeholder="Комментарий"></textarea>

<button id="orderBtn">

✅ Оформить заказ

</button>

</section>

<div id="cartModal" class="cartModal">

    <div class="cartContent">

        <div class="cartHeader">
            <h2>🛒 Корзина</h2>
            <button id="closeCart">✖</button>
        </div>

        <div id="cartItems"></div>

        <h3 id="cartTotal">Итого: 0 сум</h3>

        <button id="checkoutBtn">
            📦 Перейти к оформлению
        </button>

    </div>

</div>
  
<footer>

© 2026 SamsaGo

</footer>

<script src="script.js"></script>

</body>
</html>
